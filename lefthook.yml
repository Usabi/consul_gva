        - tests
      run: npm run test:rspec-failures -- {staged_files}

pre-commit:
  parallel: true
  jobs:
    - run: npm run lint:eslint -- {staged_files}
      glob: "*.{js,ts,jsx,tsx}"

    - name: rubocop
      glob: "*.rb"
      exclude:
        - config/application.rb
        - config/routes.rb
      run: npm run lint:rubocop -- --force-exclusion {staged_files}
