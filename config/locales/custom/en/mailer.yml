en:
  mailers:
    duplicated_proposal_for_author:
      sample:
        proposal:
          title: 'TITLE OF YOUR PROPOSAL'
          descripción: 'DESCRIPTION OF YOUR PROPOSAL'
        original_proposal:
          title: 'TITLE OF THE ORIGINAL PROPOSAL'
          descripción: 'DESCRIPTION OF THE ORIGINAL PROPOSAL'
      subject: "Your proposal %{proposal_title} is similar to another one"
      hi: Hi
      explanation: "We have noticed that the initiative <strong>%{title}</strong> you have submitted is very similar to another one already published on the platform:"
      reason: "When there are several almost identical initiatives, support can be divided between them and make it difficult to achieve the main objective: to gather the necessary support within the established deadline."
      option: "Therefore, we encourage you to review the existing initiative and consider <strong>withdrawing your proposal</strong> in order to focus your efforts on the one that already has more support or is more developed. If you decide to do so, you can indicate in your initiative that you are withdrawing it because it is the same or very similar to the other one. To withdraw it, click on this link:"
      alternative: "If you prefer to keep your initiative active, that's fine: it will continue to be available on the platform as before."
      sincerely: Thank you for your participation and for contributing your ideas to the community.
